global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'gestion-patients'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gestion-patients:8080']

  - job_name: 'gestion-medecins'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gestion-medecins:8082']

  - job_name: 'gestion-rendezvous'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gestion-rendezvous:8081']
